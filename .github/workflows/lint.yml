name: Lint
# Enforces in CI what scripts/sync.sh enforces at push time, so a broken
# frontmatter block (the silent-drop failure mode documented in CLAUDE.md)
# or a shell regression can never land on main unnoticed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontmatter:
    name: Skill + agent frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Lint frontmatter + skill references (strict YAML parse, name, description cap, ref resolution)
        run: bash scripts/sync.sh lint
      - name: Catalog tables match frontmatter (no doc drift)
        run: bash scripts/gen-docs.sh check

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Delegated to the same script scripts/sync.sh runs at push time, so the
      # local gate and CI can't check different files. The list used to be
      # inlined here and had already drifted — it omitted
      # settings/statusline-command.sh despite the step's name.
      - name: ShellCheck all tracked shell scripts
        # REQUIRE_SHELLCHECK=1: fail the build if the linter is missing rather
        # than skipping with a warning, which is the local-dev behavior.
        run: REQUIRE_SHELLCHECK=1 bash scripts/lint-shell.sh

  parser-smoke-tests:
    name: Transcript parser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests against tests/fixtures/
        run: bash tests/smoke_test_parsers.sh

  spot-ai-rates:
    name: spot-ai measurement definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measurement fixture (definitions behind GRAYLIST reference rates)
        run: python3 skills/spot-ai/tests/test_measure_rates.py
